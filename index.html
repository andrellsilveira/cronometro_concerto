<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contando as horas para o Concerto</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #f7d1e0, #b2e2f2, #fdfd96);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #5d4037;
  text-align: center;
  overflow: hidden;
  position: relative;
}

#timer {
  font-size: 1.5rem;
  background: rgba(255, 255, 255, 0.85);
  padding: 20px 30px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  z-index: 10;
  backdrop-filter: blur(4px);
}

/* Imagem das Silhuetas (posicionada atrás das velas) */
.silhueta-container {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 900px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 2; /* Camada abaixo das velas */
  pointer-events: none;
}

.silhueta-img {
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  opacity: 0.9;
}

/* Velas e Chamas (sobrepõem a imagem das silhuetas) */
.candle {
  position: absolute;
  width: 12px;
  height: 50px;
  background: #fff;
  bottom: 15px;
  border-radius: 4px;
  z-index: 5; /* Camada acima da imagem das silhuetas */
  box-shadow: inset -2px 0 4px rgba(0,0,0,0.1);
}

.flame {
  position: absolute;
  top: -18px;
  left: 1px;
  width: 10px;
  height: 20px;
  background: #ffab40;
  border-radius: 50% 50% 20% 20%;
  box-shadow: 0 0 8px #ffab40, 0 0 16px #ffeb3b, 0 0 24px #ff9800;
  animation: flicker 0.5s infinite alternate;
}

/* Estrelas caindo */
.estrela {
  position: absolute;
  top: -30px;
  color: #fff;
  text-shadow: 0 0 6px #fff, 0 0 12px #ffeb3b;
  pointer-events: none;
  z-index: 3;
  animation: cair linear infinite;
}

.estrela-inner {
  display: inline-block;
  animation: piscarEstrela infinite alternate ease-in-out;
}

@keyframes cair {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
}

@keyframes piscarEstrela {
  0% { opacity: 0.2; transform: scale(0.6); }
  100% { opacity: 1; transform: scale(1.3); }
}

@keyframes flicker {
  0% { opacity: 0.6; transform: scale(0.85) drop-shadow(0 0 4px #ffeb3b); }
  100% { opacity: 1; transform: scale(1.1) drop-shadow(0 0 12px #ffeb3b); }
}
</style>
</head>
<body>

<div id="timer">Carregando...</div>

<!-- Container da imagem das silhuetas -->
<div class="silhueta-container">
  <img src="https://w7.pngwing.com/pngs/652/834/png-transparent-orchestra-music-conductor-high-school-band-text-hand-people.png" alt="Silhuetas de Músicos" class="silhueta-img">
</div>

<script>
// Data alvo: 21/08/2026 às 17:00:00
const dataAlvo = new Date("2026-08-21T17:00:00").getTime();

function atualizarContador() {
  const agora = new Date().getTime();
  const diferenca = dataAlvo - agora;

  const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
  const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

  document.getElementById("timer").innerHTML = 
    `Contando as horas...<br/><br/>Faltam ${dias} dias e ${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')} para irmos ao concerto!!<br />Será em 21/08/2026 às 17:00<br/><br/>TE AMO!`;
}

// Criar velas dinamicamente sobre a imagem
for(let i = 0; i < 45; i++) {
  let candle = document.createElement('div');
  candle.className = 'candle';
  candle.style.left = (Math.random() * 96 + 1) + 'vw';
  candle.style.height = (Math.random() * 30 + 25) + 'px';
  
  let flame = document.createElement('div');
  flame.className = 'flame';
  
  candle.appendChild(flame);
  document.body.appendChild(candle);
}

// Criar estrelas piscantes caindo
const quantidadeEstrelas = 35;
for(let i = 0; i < quantidadeEstrelas; i++) {
  let estrela = document.createElement('div');
  estrela.className = 'estrela';
  estrela.style.left = (Math.random() * 98) + 'vw';

  const duracaoCair = Math.random() * 4 + 3;
  const atraso = Math.random() * 5;
  const duracaoPiscar = Math.random() * 0.6 + 0.3;
  const tamanho = Math.random() * 16 + 10;

  estrela.style.animationDuration = `${duracaoCair}s`;
  estrela.style.animationDelay = `${atraso}s`;
  estrela.style.fontSize = `${tamanho}px`;

  let inner = document.createElement('span');
  inner.className = 'estrela-inner';
  inner.innerHTML = '★';
  inner.style.animationDuration = `${duracaoPiscar}s`;

  estrela.appendChild(inner);
  document.body.appendChild(estrela);
}

setInterval(atualizarContador, 1000);
atualizarContador();
</script>

</body>
</html>
